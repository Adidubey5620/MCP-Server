[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya", email = "adityanarayan5620@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "langchain[mcp]>=1.4.9",
    "langchain-openai>=1.7.4",
    "uuid>=1.30",
    "asyncio>=4.0.0",
    "fastmcp>=4.1.6",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
